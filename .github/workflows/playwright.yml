name: Playwright

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  smoke:
    name: smoke
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        run: npx playwright test --grep @smoke --project=chromium --project=api
      - name: Cucumber smoke
        run: npm run bdd:smoke
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports-smoke
          path: |
            playwright-report/
            reports/
          retention-days: 14

  test:
    name: ${{ matrix.suite }}
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [playwright, cucumber]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Playwright Test
        if: matrix.suite == 'playwright'
        run: npx playwright test
      - name: Cucumber BDD
        if: matrix.suite == 'cucumber'
        run: npm run bdd
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports-${{ matrix.suite }}
          path: |
            playwright-report/
            reports/
          retention-days: 14
